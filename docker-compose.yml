
services:
  app:
    build: .
    environment:
      OLLAMA_URL: http://ollama:11434
    ports:
      - "8501:8501"
    depends_on:
      - qdrant
      - ollama
    volumes:
      - .:/app

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

volumes:
  ollama_data:
